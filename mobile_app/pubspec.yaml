name: settlegraph_mobile
description: "Evidence-led payment review for SettleGraph."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.1
  package_info_plus: ^10.2.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
  assets:
    - assets/fixtures/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
