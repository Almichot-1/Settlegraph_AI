components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DemoCode:
      type: apiKey
      in: header
      name: X-Demo-Access-Code
    WebhookSignature:
      type: apiKey
      in: header
      name: X-BankSim-Signature
  schemas:
    Member:
      type: object
      additionalProperties: false
      required: [id, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [OWNER, ANALYST, REVIEWER, VIEWER]
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          type: string
          nullable: true
    Money:
      type: object
      required:
      - minor_units
      - currency
      properties:
        minor_units:
          type: string
          pattern: ^-?[0-9]+$
        currency:
          type: string
          enum:
          - ETB
      additionalProperties: false
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    Role:
      type: string
      enum:
      - OWNER
      - ANALYST
      - REVIEWER
      - VIEWER
    Organization:
      type: object
      required:
      - id
      - name
      - mode
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          type: string
          enum:
          - DEMO
          - PRODUCTION
      additionalProperties: false
    Membership:
      type: object
      required:
      - organization
      - role
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          $ref: '#/components/schemas/Role'
      additionalProperties: false
    UserProfile:
      type: object
      required:
      - id
      - display_name
      - memberships
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      additionalProperties: false
    DemoSessionRequest:
      type: object
      required:
      - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    DemoSessionResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_at
      - user
      - default_organization_id
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserProfile'
        default_organization_id:
          type: string
          format: uuid
      additionalProperties: false
    HealthStatus:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - UP
          - NOT_READY
        service:
          type: string
      additionalProperties: false
    Provider:
      type: object
      required:
      - id
      - name
      - kind
      - sync_status
      - last_observed_at
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
          - BANK
          - WALLET
          - GATEWAY
        sync_status:
          type: string
          enum:
          - HEALTHY
          - STALE
          - OUTAGE
          - NEVER_SYNCED
        last_observed_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ProviderList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        next_cursor:
          type: string
          nullable: true
      additionalProperties: false
    DashboardSummary:
      type: object
      required:
      - as_of
      - orders_expected
      - payments_accepted
      - settlements_observed
      - unmatched_payments
      - open_cases
      - providers
      - coverage
      properties:
        as_of:
          type: string
          format: date-time
        orders_expected:
          $ref: '#/components/schemas/Money'
        payments_accepted:
          $ref: '#/components/schemas/Money'
        settlements_observed:
          $ref: '#/components/schemas/Money'
        unmatched_payments:
          $ref: '#/components/schemas/Money'
        open_cases:
          type: integer
          minimum: 0
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        coverage:
          type: object
          required:
          - source_status
          - is_complete
          properties:
            source_status:
              type: string
              enum:
              - COMPLETE
              - INCOMPLETE_SOURCE
              - STALE
            is_complete:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    TimePoint:
      type: object
      required:
      - bucket_start
      - payments_accepted
      - settlements_observed
      properties:
        bucket_start:
          type: string
          format: date-time
        payments_accepted:
          $ref: '#/components/schemas/Money'
        settlements_observed:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    DashboardSeries:
      type: object
      required:
      - granularity
      - points
      properties:
        granularity:
          type: string
          enum:
          - HOUR
          - DAY
        points:
          type: array
          items:
            $ref: '#/components/schemas/TimePoint'
      additionalProperties: false
    AccountView:
      type: object
      required:
      - id
      - provider_id
      - account_label
      - account_type
      - last_observed_at
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
        account_label:
          type: string
        account_type:
          type: string
          enum:
          - MERCHANT
          - CUSTOMER
        last_observed_at:
          type: string
          format: date-time
          nullable: true
        observed_balance:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    AccountPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountView'
        next_cursor:
          type: string
          nullable: true
      additionalProperties: false
    Order:
