openapi: 3.0.3
info:
  title: SettleGraph AI — Web + Mobile Public API
  version: 2.0.0-draft
  description: Normative client contract. See docs/implementation-progress.md for supported operations. Financial amounts are decimal-string
    minor units. Simulated provider data is not authenticated real-world bank balance information.
servers:
- url: http://localhost:8080
  description: Local development; HTTPS in deployment
security:
- BearerAuth: []
tags:
- name: Health
- name: Identity
- name: Providers
- name: Dashboard
- name: Orders
- name: Transactions
- name: Settlements
- name: Reconciliation
- name: Cases
- name: Investigations
- name: Audit
- name: Demo
- name: Ingestion
- name: Imports
paths:
  /health/live:
    get:
      tags:
      - Health
      operationId: getLiveness
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      x-implementation-priority: P0
      x-client: web-primary
  /health/ready:
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Required dependency readiness
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-implementation-priority: P0
      x-client: web-primary
  /v1/demo/sessions:
    post:
      tags:
      - Identity
      operationId: createDemoSession
      summary: Mint demo-only session token
      description: Only enabled when APP_MODE=demo. Server-configured access codes select seeded demo principals; a display name never grants a role. Never expose demo minting in production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      security:
      - DemoCode: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
      x-implementation-priority: P0
      x-client: web-flutter
  /v1/me:
    get:
      tags:
      - Identity
      operationId: getMe
      summary: Current user and organization memberships
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-implementation-priority: P0
      x-client: web-flutter
  /v1/members:
    get:
      tags: [Identity]
      operationId: listMembers
      summary: Active organization members available for assignment (OWNER or ANALYST)
      parameters:
