  /v1/integrations/banksim/events:
    post:
      tags:
      - Ingestion
      operationId: acceptBankSimEvent
      summary: Ingest signed BankSim webhook
      description: 'Requires X-BankSim-Event-Id, X-BankSim-Delivery-Timestamp (epoch seconds), and X-BankSim-Signature:
        v1=<lowercase hex HMAC SHA256>. Signature input timestamp + "." + event_id + "." + exact raw body.
        Delivery freshness ±300 seconds.'
      security:
      - WebhookSignature: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: X-BankSim-Event-Id
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: X-BankSim-Delivery-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: X-BankSim-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: ^v1=[a-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankEvent'
