name: Mobile validation
on:
  pull_request:
    paths: ['mobile_app/**', 'contracts/**', 'fixtures/**', '.github/workflows/mobile_ci_validation.yml']
  push:
    branches: [master, 'feature/settlegraph-mobile']
    paths: ['mobile_app/**', 'contracts/**', 'fixtures/**', '.github/workflows/mobile_ci_validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-24.04
    env:
      TZ: Africa/Addis_Ababa
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 scripts/sync_fixtures.py --check
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Upload visual test differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-diffs
          path: mobile_app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: settlegraph-android-debug
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile_app/coverage/lcov.info
          if-no-files-found: ignore
