services:
  web:
    build:
      context: ./settlegraph-web
      dockerfile: Dockerfile.local
    environment:
      SETTLEGRAPH_DATA_MODE: backend
      SETTLEGRAPH_API_BASE_URL: http://api:8080
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:?run make init-demo-env}
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    networks: [provider-http-net]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 30
